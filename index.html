<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        span {
            color: red;
        }
    </style>
</head>

<body>
    <a href="https://ys.mihoyo.com/main/"><span>5</span>后自动跳转页面</a>
    <script>
        let num = 5
        let timeId = setInterval(function () {
            num--
            const a = document.querySelector('a')
            a.innerHTML = `<span>${num}</span>后自动跳转首页`
            if (num === 0) {
                clearInterval(timeId)
                location.href = 'https://ys.mihoyo.com/main/'
            }
        }, 1000)
    </script>
</body>

</html>
